name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      # No lockfile and no dependencies (plain Node scripts), so there is no `npm ci` step.
      - name: Check (builds the review fixture into site/dist; the production build below replaces it)
        run: npm run site
      # Production build: never --fixture / HUB_FIXTURE. It also fails if fixture makers leak in.
      - name: Production build
        run: npm run build:site
        env:
          HUB_FIXTURE: ""
      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy site/dist --project-name wolos-hub --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
